name: Build check

# Production runs on a home server (see "Production" in README.md), so this
# workflow only builds: every push (main and development branches) and every
# pull request into main, to catch errors early. It never deploys anything.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
